name: Harness — PR variance

# On PR open/update, compare the cheap actuals from the diff (files touched,
# downstream fanout) against the issue's prediction and post an ADVISORY comment.
# Never blocks the merge (§1.7): acting on the flag is a human decision, otherwise
# the flag becomes a treatment that confounds the calibration. No linked issue or
# no prediction → no-op.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  variance:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Compute variance
        id: variance
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR" --json body --jq '.body')
          ISSUE=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "${ISSUE:-}" ]; then
            echo "No linked issue — skipping variance."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export HARNESS_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | wc -l | tr -d ' ')
          CHANGED=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -E '^(src|electron)/.*\.(ts|tsx)$' | grep -v __tests__ || true)
          FANOUT=0
          if [ -n "$CHANGED" ]; then
            BASES=$(printf '%s\n' "$CHANGED" | xargs -n1 basename | sed -E 's/\.(ts|tsx)$//' | sort -u)
            FANOUT=$(for b in $BASES; do grep -rl "from '.*${b}'" src electron 2>/dev/null || true; done | grep -v __tests__ | sort -u | wc -l | tr -d ' ')
          fi
          export HARNESS_FANOUT="$FANOUT"

          npx tsx scripts/complexity/pr-variance.ts "$ISSUE" > variance.md || true
          if [ -s variance.md ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
          else
            echo "No prediction for #$ISSUE — advisory no-op."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert advisory comment
        if: steps.variance.outputs.skip == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('variance.md', 'utf8')
            const marker = '<!-- harness:variance -->'
            const prNumber = context.payload.pull_request.number
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
              core.info(`Updated advisory comment ${existing.id}`)
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body })
              core.info('Created advisory comment')
            }
