name: Publish npx launcher

# Publishes the thin launcher in cli/ (npm package "marvinz") on a release tag.
# The published version is set to match the release version (e.g. v0.12.0 →
# marvinz@0.12.0), so npm stays in sync with the app releases. Lets users run
# `npx marvinz`. Gated on the NPM_TOKEN secret — skips cleanly if it's not set,
# so the release pipeline never breaks on its absence. Idempotent: skips if that
# version is already on npm, so re-runs / re-tags don't fail.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Detect NPM_TOKEN
        id: detect
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN not set — skipping npm publish."
          fi

      - uses: actions/checkout@v4
        if: steps.detect.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ok == 'true'
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: ver
        if: steps.detect.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch (no tag): use the latest published GitHub Release.
            V="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | sed 's/^v//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved launcher version: $V"

      - name: Set version + publish if new
        if: steps.detect.outputs.ok == 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          npm version "$V" --no-git-tag-version --allow-same-version
          if npm view "marvinz@$V" version >/dev/null 2>&1; then
            echo "marvinz@$V already published — skipping"
          else
            npm publish --access public
          fi
