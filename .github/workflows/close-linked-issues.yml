name: Close Linked Issues

# GitHub auto-closes issues only when a PR merges into the default branch (main).
# This project merges feature PRs into develop, so `Closes #N` never fires natively.
# This workflow replicates that behavior for merges into develop.

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close issues referenced in the PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const body = pr.body || ''
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            const ids = [...new Set([...body.matchAll(re)].map((m) => Number(m[1])))]
            if (ids.length === 0) {
              core.info('No closing keywords found in PR body.')
              return
            }
            for (const issue_number of ids) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Closed by #${pr.number} (merged into \`develop\`).`,
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              })
              core.info(`Closed #${issue_number}`)
            }
