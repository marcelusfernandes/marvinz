name: Harness — record outcome

# On merge into develop, measure the OutcomeRecord from git/gh and append it to
# the complexity ledger (Phase 2) — the §1.6 separate measurement step.
# develop is protected (PRs only), so outcomes are NOT committed to develop:
# they are appended to the orphan `complexity-ledger` data branch using the
# native GITHUB_TOKEN (contents:write) — no secret/PAT, no branch drift (the
# orphan branch holds only the ledger). Non-fatal (§1.9): a missing linked
# issue, a measurement failure, or push contention never fails the workflow.

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  outcome:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Measure outcome
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -uo pipefail

          # Resolve the linked issue from the PR body (Closes/Fixes/Resolves #N).
          # PRs into develop don't populate closingIssuesReferences natively.
          # Errexit pitfall (#544): GitHub runs steps with `bash -e {0}` and
          # `set -uo pipefail` does not clear the inherited -e, so an unguarded
          # gh failure would fail the workflow — skip instead (non-fatal §1.9).
          BODY=$(gh pr view "$PR" --json body --jq '.body') \
            || { echo "::warning::gh pr view failed — skipping outcome (non-fatal §1.9)"; echo "have_outcome=0" >> "$GITHUB_OUTPUT"; exit 0; }
          ISSUE=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "${ISSUE:-}" ]; then
            echo "No linked issue in PR body — nothing to measure."
            echo "have_outcome=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Measuring outcome for issue #$ISSUE (PR #$PR)"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          export HARNESS_ISSUE="$ISSUE"
          export HARNESS_VERSION=$(npx tsx scripts/complexity/harness-version.ts claude-opus-4-8)
          export HARNESS_PR_NUMBER="$PR"
          export HARNESS_MERGE_SHA="$MERGE_SHA"
          export HARNESS_FILES=$(gh pr view "$PR" --json files --jq '.files | length')
          export HARNESS_ITERATIONS=$(gh pr view "$PR" --json commits --jq '.commits | length')
          export HARNESS_REVIEW_CYCLES=$(gh pr view "$PR" --json reviews --jq '[.reviews[] | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="COMMENTED")] | length')
          export HARNESS_CHANGES_REQUESTED=$(gh pr view "$PR" --json reviews --jq '[.reviews[] | select(.state=="CHANGES_REQUESTED")] | length')
          export HARNESS_CREATED_AT=$(gh pr view "$PR" --json createdAt --jq '.createdAt')
          export HARNESS_MERGED_AT=$(gh pr view "$PR" --json mergedAt --jq '.mergedAt')

          # The exports above DO run under the inherited `bash -e {0}`, but survive a
          # failed gh call only because `export VAR=$(cmd)` masks the substitution's
          # exit status — leaving the var empty. Number("")=0 is a valid int to Zod,
          # so we'd record a syntactically-valid all-zero outcome. Bail instead —
          # never land garbage on the ledger (§1.9: skip, don't fail).
          for k in HARNESS_VERSION HARNESS_FILES HARNESS_ITERATIONS HARNESS_REVIEW_CYCLES \
                   HARNESS_CHANGES_REQUESTED HARNESS_CREATED_AT HARNESS_MERGED_AT; do
            if [ -z "${!k}" ]; then
              echo "::warning::$k empty (gh call failed?) — skipping outcome (non-fatal §1.9)"
              echo "have_outcome=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Recompute downstream fanout of the changed src/electron files (best-effort grep).
          CHANGED=$(gh pr view "$PR" --json files --jq '.files[].path' | grep -E '^(src|electron)/.*\.(ts|tsx)$' | grep -v __tests__ || true)
          FANOUT=0
          if [ -n "$CHANGED" ]; then
            BASES=$(printf '%s\n' "$CHANGED" | xargs -n1 basename | sed -E 's/\.(ts|tsx)$//' | sort -u)
            # Errexit pitfall (#544): with no importers the `grep -v` stage exits 1,
            # pipefail fails the substitution and errexit kills the step — guard it
            # with `|| true` so the empty case yields FANOUT=0.
            FANOUT=$({ for b in $BASES; do grep -rl "from '.*${b}'" src electron 2>/dev/null || true; done; } | { grep -v __tests__ || true; } | sort -u | wc -l | tr -d ' ')
          fi
          export HARNESS_FANOUT="$FANOUT"

          # Build + validate the OutcomeRecord (measure-outcome parses via Zod) into a
          # single JSON line. Non-fatal: a failure here just skips this run (§1.9).
          if npx tsx scripts/complexity/measure-outcome.ts > outcome.json; then
            echo "have_outcome=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::measure-outcome failed — skipping (non-fatal §1.9)"
            echo "have_outcome=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Append to orphan complexity-ledger branch
        if: steps.measure.outputs.have_outcome == '1'
        env:
          ISSUE: ${{ steps.measure.outputs.issue }}
        run: |
          set -uo pipefail
          # outcome.json is one validated OutcomeRecord JSON line. Append it to the
          # orphan data branch via a worktree, so this checkout stays untouched.
          # Re-fetch + reset + re-append per attempt → race-safe against concurrent merges.
          if ! git fetch origin complexity-ledger 2>/dev/null; then
            echo "::warning::complexity-ledger branch not found — skipping (non-fatal §1.9)"
            exit 0
          fi
          git worktree add --force /tmp/ledger origin/complexity-ledger
          for attempt in 1 2 3; do
            git -C /tmp/ledger fetch origin complexity-ledger
            git -C /tmp/ledger reset --hard origin/complexity-ledger
            cat outcome.json >> /tmp/ledger/_complexity-ledger/outcomes.jsonl
            git -C /tmp/ledger add _complexity-ledger/outcomes.jsonl
            git -C /tmp/ledger \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: record outcome for #$ISSUE [skip ci]"
            if git -C /tmp/ledger push origin HEAD:complexity-ledger; then
              echo "Recorded outcome for #$ISSUE on complexity-ledger."
              exit 0
            fi
            echo "push contention — retry $attempt"
            sleep $((attempt * 3))
          done
          echo "::warning::could not push outcome after retries (non-fatal §1.9)"
          exit 0
